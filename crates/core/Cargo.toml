[package]
name = "app-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# Lets UI tests store issues and send a SyncEvent without a sync engine behind them
test-support = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10", default-features = false } # the Jira profile's time zone, which Tempo reads a start in
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] } # without the feature of a platform keyring keeps the tokens in memory only
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
