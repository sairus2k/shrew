[package]
name = "app-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# Lets UI tests send a SyncEvent without a sync engine behind it
test-support = []

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
