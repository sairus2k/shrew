[package]
name = "app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
app-core = { path = "../core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] } # local time of a worklog
dirs = "6" # ~/Library/Application Support
gpui-kit = "0.9.1"
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-kit", "menu-state"] } # the menu bar item
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
app-core = { path = "../core", features = ["test-support"] }
gpui-kit = { version = "0.9.1", features = ["test-support"] }
tempfile = "3"
wiremock = "0.6"
