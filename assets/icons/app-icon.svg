<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The macOS icon grid: an 824 px rounded square centred in a 1024 px canvas, the margin holds the shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7bf0"/>
      <stop offset="1" stop-color="#3443ab"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".3"/>
    </filter>
    <!-- The glyph in a 100 unit box: white is ink, black cuts the ear and the eye through to the background. -->
    <mask id="glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <g transform="translate(51 52) scale(.6) translate(-54 -55)">
        <path fill="#fff" d="M98 66 C87 61 79 53 71 45 C62 36 54 30 43 30 C26 30 13 42 13 56 C13 71 28 80 46 80 C66 80 85 73 98 66Z"/>
        <circle fill="#fff" cx="35" cy="33" r="11"/>
        <circle fill="#000" cx="35" cy="33" r="5"/>
        <circle fill="#000" cx="60" cy="52" r="3.4"/>
      </g>
      <path fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" d="M34 62 C26 74 10 68 10 50 A40 40 0 1 1 76 80"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(192 192) scale(6.4)">
    <rect width="100" height="100" fill="#fff" mask="url(#glyph)"/>
  </g>
</svg>
